<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>reading</title><link rel="stylesheet" href="style.css"></head><body>
<header><strong>reading</strong><span class="spacer"></span><a href="admin.html">관리자</a><span id="account" class="small"></span><button id="logout" class="hidden">로그아웃</button></header><div id="message" class="notice hidden" role="alert"></div>
<section id="login" class="auth"><h2>교사 로그인</h2><p class="muted">자료는 로그인한 교사 계정에만 제공됩니다.</p><label>이메일<input id="email" class="wide" type="email" autocomplete="username"></label><label>비밀번호<input id="password" class="wide" type="password" autocomplete="current-password"></label><button id="signin">로그인</button></section>
<section id="app" class="shell hidden"><nav><select id="mode"><option value="ipad">iPad · 판서</option><option value="pc">PC · 라이브러리</option><option value="mobile">모바일 · 노트</option></select><select id="item"></select><button id="refresh">자료 갱신</button><span class="muted" id="status"></span><span class="grow"></span><div id="tools" class="tools"><button data-tool="scroll" class="active">스크롤</button><button data-tool="pen">펜</button><button data-tool="highlighter">형광펜</button><button data-tool="eraser">지우개</button><button data-tool="lasso">올가미</button><button data-tool="laser">레이저</button><input type="color" id="color" value="#d93838" title="색상"><label>굵기 <input type="range" id="width" min="1" max="20" value="3"></label><button id="undo">되돌리기</button><button id="clear">전체 지우기</button><select id="font"><option value="Arial">Arial</option><option value="Georgia">Georgia</option><option value="Times New Roman">Times New Roman</option></select><label>글자 <input type="range" id="fontSize" min="12" max="32" value="19"></label><label>행간 <input type="range" id="lineHeight" min="12" max="28" value="18"></label><label>자간 <input type="range" id="letterSpacing" min="0" max="30" value="0"></label></div></nav><div id="main"></div></section>
<script src="config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script><script src="common.js"></script><script src="main.js"></script></body></html>
