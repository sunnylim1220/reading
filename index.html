<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>reading</title><link rel="stylesheet" href="style.css"></head><body>
<header><strong>reading</strong><span class="spacer"></span><a href="admin.html">관리자</a><span id="account" class="small"></span><button id="logout" class="hidden">로그아웃</button></header><div id="message" class="notice hidden" role="alert"></div>
<section id="login" class="auth"><h2>교사 로그인</h2><p class="muted">자료는 로그인한 교사 계정에만 제공됩니다.</p><label>이메일<input id="email" class="wide" type="email" autocomplete="username"></label><label>비밀번호<input id="password" class="wide" type="password" autocomplete="current-password"></label><button id="signin">로그인</button></section>
<section id="app" class="shell hidden"><nav><div id="modeButtons" class="icon-group" aria-label="보기 모드"><button type="button" data-mode="ipad" title="iPad 판서" aria-label="iPad 판서">▣</button><button type="button" data-mode="pc" title="PC 라이브러리" aria-label="PC 라이브러리">▤</button><button type="button" data-mode="mobile" title="모바일 노트" aria-label="모바일 노트">▯</button></div><select id="book" aria-label="교재"></select><select id="chapter" aria-label="목차"></select><select id="item" aria-label="제목"></select><button id="refresh">자료 갱신</button><span class="muted" id="status"></span><span class="grow"></span><div id="tools" class="tools"><button data-tool="scroll" class="active" title="스크롤" aria-label="스크롤">↕</button><button data-tool="pen" title="펜" aria-label="펜">✎</button><button data-tool="highlighter" title="형광펜" aria-label="형광펜">▰</button><button data-tool="eraser" title="지우개" aria-label="지우개">⌫</button><button data-tool="lasso" title="올가미" aria-label="올가미">◌</button><button data-tool="laser" title="레이저" aria-label="레이저">⌖</button><label class="icon-control" title="색상"><span>◉</span><input type="color" id="color" value="#d93838" aria-label="색상"></label><label class="icon-control" title="굵기"><span>≋</span><input type="range" id="width" min="1" max="20" value="3" aria-label="굵기"></label><button id="undo" title="되돌리기" aria-label="되돌리기">↶</button><button id="clear" title="전체 지우기" aria-label="전체 지우기">⌧</button><label class="icon-control" title="글꼴"><span>𝐀</span><select id="font" aria-label="글꼴"><option value="Arial">Arial</option><option value="Georgia">Georgia</option><option value="Times New Roman">Times New Roman</option></select></label><label class="icon-control" title="글자 크기"><span>ᴀA</span><input type="range" id="fontSize" min="12" max="32" value="19" aria-label="글자 크기"></label><label class="icon-control" title="행간"><span>☷</span><input type="range" id="lineHeight" min="12" max="28" value="18" aria-label="행간"></label><label class="icon-control" title="자간"><span>↔</span><input type="range" id="letterSpacing" min="0" max="30" value="0" aria-label="자간"></label></div></div></nav><div id="main"></div></section>
<script src="config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script><script src="common.js"></script><script src="main.js"></script></body></html>
