<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>reading</title><link rel="stylesheet" href="style.css"></head><body>
<header><strong>reading</strong><span class="spacer"></span><a href="admin.html">관리자</a><span id="account" class="small"></span><button id="logout" class="hidden">로그아웃</button></header><div id="message" class="notice hidden" role="alert"></div>
<section id="login" class="auth"><h2>교사 로그인</h2><p class="muted">자료는 로그인한 교사 계정에만 제공됩니다.</p><label>이메일<input id="email" class="wide" type="email" autocomplete="username"></label><label>비밀번호<input id="password" class="wide" type="password" autocomplete="current-password"></label><button id="signin">로그인</button></section>
<section id="app" class="shell hidden"><nav><div id="modeButtons" class="icon-group" aria-label="보기 모드"><button type="button" data-mode="ipad" title="iPad 판서" aria-label="iPad 판서"><svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><rect x="7" y="6" width="10" height="12"/></svg></button><button type="button" data-mode="pc" title="PC 라이브러리" aria-label="PC 라이브러리"><svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="3" width="20" height="15" rx="2"/><path d="M8 22h8M12 18v4"/></svg></button><button type="button" data-mode="mobile" title="모바일 노트" aria-label="모바일 노트"><svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="6" y="2" width="12" height="20" rx="2"/><path d="M11 18h2"/></svg></button></div><select id="book" aria-label="교재"></select><select id="chapter" aria-label="목차"></select><select id="item" aria-label="제목"></select><button id="refresh" title="자료 갱신" aria-label="자료 갱신"><svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M20 7v5h-5M4 17v-5h5"/><path d="M5 10a8 8 0 0 1 14-3l1 5M4 12l1 5a8 8 0 0 0 14-3"/></svg></button><span class="muted hidden" id="status"></span><span class="grow"></span><div id="tools" class="tools"><button data-tool="scroll" class="active" title="스크롤" aria-label="스크롤"><svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v18M8 7l4-4 4 4M8 17l4 4 4-4"/></svg></button><button data-tool="pen" title="펜" aria-label="펜"><svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m4 20 4-1 12-12-3-3L5 16zM15 6l3 3"/></svg></button><button data-tool="highlighter" title="형광펜" aria-label="형광펜"><svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m4 16 11-12 5 5-11 12H4z" fill="#f5e15a" stroke="#b49b12"/><path d="M4 22h17" stroke="#f5d843" stroke-width="3"/></svg></button><button data-tool="eraser" title="지우개" aria-label="지우개"><svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 14 14 4l7 7-10 10H9z" fill="#f4a8bf" stroke="#bf6082"/><path d="M9 21h12" stroke="#bf6082"/></svg></button><button data-tool="lasso" title="올가미" aria-label="올가미"><svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 7c-3-4-11-3-13 2-3 7 5 11 11 8 4-2 4-6 1-7-2-1-4 0-4 2M12 18c0 4 6 5 8 2"/></svg></button><button data-tool="laser" title="레이저" aria-label="레이저"><svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2v5M12 17v5M2 12h5M17 12h5"/></svg></button><div class="stroke-presets" aria-label="선 굵기"><button type="button" data-size="0" title="얇게"><span class="stroke-preview stroke-1"></span></button><button type="button" data-size="1" title="보통"><span class="stroke-preview stroke-2"></span></button><button type="button" data-size="2" title="굵게"><span class="stroke-preview stroke-3"></span></button></div><div class="palette" aria-label="색상 팔레트"><button type="button" data-color="#111111" title="검정" style="--swatch:#111111"></button><button type="button" data-color="#d93838" title="빨강" style="--swatch:#d93838"></button><button type="button" data-color="#64a8ff" title="파랑" style="--swatch:#64a8ff"></button><button type="button" data-color="#8c4ec9" title="보라" style="--swatch:#8c4ec9"></button><button type="button" data-color="#75cc8e" title="초록" style="--swatch:#75cc8e"></button><button type="button" data-color="#ed8b24" title="주황" style="--swatch:#ed8b24"></button></div><button id="undo" title="되돌리기" aria-label="되돌리기"><svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 14 4 9l5-5M4 9h10a6 6 0 0 1 0 12"/></svg></button><button id="redo" title="다시 실행" aria-label="다시 실행"><svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 14 5-5-5-5m5 5H10a6 6 0 0 0 0 12"/></svg></button><button id="clear" title="전체 지우기" aria-label="전체 지우기"><svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M8 8l8 8m0-8-8 8"/></svg></button><select id="font" aria-label="글꼴"><option value="Arial">Arial</option><option value="Georgia">Georgia</option><option value="Times New Roman">Times New Roman</option></select><div class="type-steppers"><div class="stepper" title="글자 크기"><span>AA</span><button data-step="fontSize:-1" aria-label="글자 작게">−</button><output id="fontSizeLabel">3</output><button data-step="fontSize:1" aria-label="글자 크게">+</button></div><div class="stepper" title="행간"><span>☷</span><button data-step="lineHeight:-1" aria-label="행간 좁게">−</button><output id="lineHeightLabel">3</output><button data-step="lineHeight:1" aria-label="행간 넓게">+</button></div><div class="stepper" title="자간"><span>↔</span><button data-step="letterSpacing:-1" aria-label="자간 좁게">−</button><output id="letterSpacingLabel">3</output><button data-step="letterSpacing:1" aria-label="자간 넓게">+</button></div></div></div></div></nav><div id="main"></div></section>
<script src="config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script><script src="common.js"></script><script src="main.js"></script></body></html>
