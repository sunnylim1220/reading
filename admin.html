<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>reading / admin</title><link rel="stylesheet" href="style.css"></head><body>
<header><strong>reading / admin</strong><span class="spacer"></span><a href="./">판서·노트</a><span id="account" class="small"></span><button id="logout" class="hidden">로그아웃</button></header>
<div id="message" class="notice hidden" role="alert"></div>
<section id="login" class="auth"><h2>교사 로그인</h2><p class="muted">등록된 교사 계정만 데이터에 접근할 수 있습니다.</p><label for="email">이메일</label><input id="email" class="wide" type="email" autocomplete="username"><label for="password">비밀번호</label><input id="password" class="wide" type="password" autocomplete="current-password"><button id="signin">로그인</button></section>
<section id="app" class="hidden"><nav><button id="new">+ 새 지문</button><button id="save">저장</button><button id="delete" class="danger">현재 지문 삭제</button><button id="refresh">새로고침</button><span class="muted" id="status"></span></nav><div class="admin-layout"><aside class="items" id="items"></aside><main class="editor"><label>제목<input class="wide" id="title" placeholder="Neolithic Revolution"></label><label>분류<input class="wide" id="category" placeholder="final+"></label><label>지문 (Enter로 입력한 문단 구분 유지)<textarea id="passage" rows="17" placeholder="지문을 입력하세요"></textarea></label><h3>문제 · 정답 · 팁</h3><div id="questions"></div><button id="addQuestion">+ 문제 추가</button></main></div></section>
<script src="config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script><script src="common.js"></script><script src="admin.js"></script></body></html>
