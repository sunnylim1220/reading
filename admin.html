<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>reading / admin</title><link rel="stylesheet" href="style.css"></head><body class="admin-v18">
<header><strong>reading / admin</strong><span class="spacer"></span><a href="./">reading</a><span id="account" class="small"></span><button id="logout" class="hidden">로그아웃</button></header><div id="message" class="notice hidden" role="alert"></div>
<section id="login" class="auth"><h2>교사 로그인</h2><label for="email">이메일</label><input id="email" type="email" autocomplete="username"><label for="password">비밀번호</label><input id="password" type="password" autocomplete="current-password"><button id="signin">로그인</button></section>
<section id="app" class="hidden"><nav class="admin-toolbar"><button id="new" title="새 지문" aria-label="새 지문">＋</button><button id="save" title="저장" aria-label="저장"><svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 3h14l3 3v15H3V3zM7 3v7h10V3M7 21v-8h10v8"/></svg></button><button id="delete" title="현재 지문 삭제" aria-label="현재 지문 삭제"><svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 7h16M9 7V4h6v3M6 7l1 14h10l1-14M10 11v7M14 11v7"/></svg></button><button id="refresh" title="새로고침" aria-label="새로고침"><svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 5v6h-6"/><path d="M20 11a8 8 0 1 0 1 5"/></svg></button><span class="grow"></span></nav>
<div class="admin-layout"><aside class="items category-sidebar"><div id="tree" class="category-tree"></div></aside><main class="editor">
<div class="admin-selector-row"><div class="selector-wrap"><button id="bookPick" class="picker" type="button">교재 선택 ▾</button><button id="bookRename" class="rename-icon" title="교재 이름 변경" aria-label="교재 이름 변경">✎</button><div id="bookMenu" class="picker-menu hidden"></div></div><div class="selector-wrap"><button id="chapterPick" class="picker" type="button">목차 선택 ▾</button><button id="chapterRename" class="rename-icon" title="목차 이름 변경" aria-label="목차 이름 변경">✎</button><div id="chapterMenu" class="picker-menu hidden"></div></div><div class="selector-wrap"><button id="titlePick" class="picker" type="button">제목 선택 ▾</button><div id="titleMenu" class="picker-menu hidden"></div></div></div>

</main></div></section><script src="config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script><script src="common.js"></script><script src="admin.js"></script></body></html>
